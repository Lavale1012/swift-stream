[project]
name = "swift-stream-server"
version = "0.1.0"
description = "API for the swift-stream video pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
